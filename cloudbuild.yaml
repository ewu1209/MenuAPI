# This Cloud Build file first builds a container image using Buildpacks,
# then deploys that image to a Cloud Run service.
steps:
  # Step 1: Build the container image using Buildpacks
  - name: 'gcr.io/k8s-skaffold/pack'
    env:
      - 'GOOGLE_RUNTIME_VERSION=20.15.1'
    args:
      - 'build'
      - 'gcr.io/$PROJECT_ID/$_REPO_NAME:$COMMIT_SHA'
      - '--builder=gcr.io/buildpacks/builder@sha256:c34b123a1b14da717544a04d33454707173b06e92150192a54972e25'
      - '--publish'

  # Step 2: Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=gcr.io/$PROJECT_ID/$_REPO_NAME:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=$_PLATFORM'
      - '--allow-unauthenticated'
      - '--service-account=330248243487-compute@developer.gserviceaccount.com'

# This section lists the final image that was built.
images:
  - 'gcr.io/$PROJECT_ID/$_REPO_NAME:$COMMIT_SHA'

# Add this 'options' block to fix the logging error.
options:
  logging: CLOUD_LOGGING_ONLY