<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Empire Events</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Lemon Milk";src:url(fonts/LEMONMILK-Light.otf);font-weight:300}
@font-face{font-family:"Lemon Milk";src:url(fonts/LEMONMILK-Regular.otf);font-weight:400}
@font-face{font-family:"Linotype Spitz";src:url(fonts/spitz-light.ttf);font-weight:300}
@font-face{font-family:"Linotype Spitz";src:url(fonts/spitz-book.ttf);font-weight:400}
:root{--bg:#0c0b09;--ink:#f3ecdf;--gold:#f2b000;--gold-rgb:242,176,0;--mute:rgba(243,236,223,.58);--hair:rgba(242,176,0,.2);
  --display:"Lemon Milk",serif;--body:"Linotype Spitz",sans-serif;--u:min(1vh,.5625vw)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 55% 38% at 50% 0%,rgba(var(--gold-rgb),.085),transparent 72%),
  radial-gradient(ellipse 120% 95% at 50% 50%,transparent 58%,rgba(0,0,0,.6))}
.frame{position:fixed;inset:0}
.frame svg{width:100%;height:100%;fill:none;stroke:var(--gold);stroke-linecap:round}
.frame .outer{opacity:.3}.frame .inner{opacity:.42}.frame .orn{opacity:.62}
.frame .bead{fill:var(--gold);stroke:none}.frame .pearl{fill:var(--gold);stroke:none;opacity:.32}

.slide{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:1fr auto;
  column-gap:calc(var(--u)*6);row-gap:calc(var(--u)*3);padding:calc(var(--u)*10) calc(var(--u)*10) calc(var(--u)*8)}
/* Feature: the event photo, then its details. */
.feature{display:grid;grid-template-columns:1.1fr 1fr;gap:calc(var(--u)*4);min-height:0}
.photo{position:relative;border:1px solid rgba(var(--gold-rgb),.42);padding:calc(var(--u)*.9)}
.photo div{height:100%;background:
  radial-gradient(ellipse 60% 45% at 50% 38%,rgba(255,190,90,.28),transparent 70%),
  radial-gradient(ellipse 90% 60% at 50% 100%,rgba(120,60,20,.35),transparent 70%),#17120c;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--u)*2);
  font-family:var(--display);font-weight:300;font-size:calc(var(--u)*1.3);letter-spacing:.3em;color:rgba(243,236,223,.35)}
.info{display:flex;flex-direction:column;justify-content:center}
.kick{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*1.9);letter-spacing:.3em;color:var(--gold)}
.when{margin-top:calc(var(--u)*1.2);font-family:var(--display);font-weight:300;font-size:calc(var(--u)*1.7);letter-spacing:.24em;color:var(--mute)}
h1{margin:calc(var(--u)*2.6) 0 calc(var(--u)*2.2);font-family:var(--display);font-weight:300;font-size:calc(var(--u)*6.4);line-height:1.05;letter-spacing:.08em}
.desc{font-size:calc(var(--u)*2.5);line-height:1.35;color:var(--mute);max-width:32ch}
.rsvp{display:flex;align-items:center;gap:calc(var(--u)*2.4);margin-top:calc(var(--u)*3.4)}
.qr{width:calc(var(--u)*11);height:calc(var(--u)*11);border:1px solid rgba(var(--gold-rgb),.42);padding:calc(var(--u)*.8)}
.qr div{height:100%;background:var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:calc(var(--u)*1.4);letter-spacing:.2em;color:var(--bg)}
.rsvp b{display:block;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*2);letter-spacing:.26em;color:var(--gold)}
.rsvp span{display:block;margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*2);color:var(--mute)}

/* Upcoming: styled exactly like a menu section. */
.upcoming h2{display:flex;align-items:baseline;margin:0 0 calc(var(--u)*1.6);padding-bottom:calc(var(--u)*1.2);border-bottom:1px solid var(--hair);
  font-family:var(--display);font-weight:400;font-size:calc(var(--u)*2.4);line-height:1;letter-spacing:.34em;color:var(--gold)}
.upcoming h2 small{margin-left:auto;font-family:var(--body);font-size:calc(var(--u)*2);letter-spacing:.04em;color:var(--mute)}
.ev{display:grid;grid-template-columns:calc(var(--u)*7) 1fr;align-items:center;gap:calc(var(--u)*2.2);padding:calc(var(--u)*1.55) 0;border-bottom:1px solid rgba(var(--gold-rgb),.08)}
.ev:last-child{border-bottom:0}
.date{text-align:center}
.date i{display:block;font-style:normal;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*1.3);letter-spacing:.24em;color:var(--gold)}
.date em{display:block;font-style:normal;font-family:var(--display);font-weight:300;font-size:calc(var(--u)*3.8);line-height:1.1}
.ev .n{font-size:calc(var(--u)*3);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .m{margin-top:calc(var(--u)*.5);font-size:calc(var(--u)*2);color:var(--mute)}
.ev.on .n{color:var(--gold)}

footer{grid-column:1/-1;display:flex;align-items:center;gap:calc(var(--u)*3);
  font-family:var(--display);font-weight:300;font-size:calc(var(--u)*1.6);letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
footer .ig{text-transform:none;letter-spacing:.14em}
footer .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--gold-rgb),.08),var(--hair),rgba(var(--gold-rgb),.08))}
.dots{display:flex;gap:calc(var(--u)*1.1);align-items:center}
.dots i{width:calc(var(--u)*.7);height:calc(var(--u)*.7);border-radius:50%;background:rgba(var(--gold-rgb),.3)}
.dots i.on{width:calc(var(--u)*3);border-radius:calc(var(--u)*.35);background:var(--gold)}

.photo div.img{background-size:cover;background-position:center}
.info,.photo{transition:opacity .9s ease}
.fade .info,.fade .photo{opacity:0}
.desc:empty,.rsvp[hidden]{display:none}
.qr div{background:var(--ink)}
.qr svg{width:100%;height:100%;display:block}
.qr canvas,.qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.ev{transition:background .6s}
</style>

<div class="frame" id="frame"></div>
<main class="slide" id="slide">
  <section class="feature">
    <div class="photo"><div id="photo">EVENT PHOTO</div></div>
    <div class="info">
      <div class="kick" id="kick"></div>
      <div class="when" id="when"></div>
      <h1 id="title"></h1>
      <p class="desc" id="desc"></p>
      <div class="rsvp" id="rsvp"><div class="qr"><div id="qr"></div></div><div><b>SCAN TO RSVP</b><span id="link"></span></div></div>
    </div>
  </section>
  <section class="upcoming">
    <h2>UPCOMING<small id="through"></small></h2>
    <div id="list"></div>
  </section>
  <footer>
    <span class="ig">@empirescottsdale</span><div class="rule"></div>
    <div class="dots" id="dots"></div>
    <div class="rule"></div><span id="count"></span>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const ALL = __EVENTS__;
const SECONDS = 12, LIST = 5;
const fan = (cx, cy, dir, len, spread, n) => {
  const pt = (deg, r) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  const angs = [...Array(n)].map((_, k) => dir - spread + 2 * spread * k / (n - 1));
  const rays = angs.map(t => { const [x, y] = pt(t, len * .25), [X, Y] = pt(t, len); return `M${x} ${y}L${X} ${Y}`; }).join("");
  const edge = angs.slice(1).map((t, k) => { const [qx, qy] = pt((t + angs[k]) / 2, len * 1.22), [X, Y] = pt(t, len); return `Q${qx} ${qy} ${X} ${Y}`; }).join("");
  const [sx, sy] = pt(angs[0], len);
  return `<path d="${rays}M${sx} ${sy}${edge}"/><circle class="bead" cx="${cx}" cy="${cy}" r="${len * .12}"/>`;
};
const LEAF = `<path d="M0 0C.35-.3.85-.25 1 0C.85.25.35.3 0 0Z"/>`;
const CORNER = `
  <path d="M5.6 .9C7.6 .9 9.4 .8 10.7 1.6C11.6 2.2 11.3 3.3 10.4 3.2C9.7 3.1 9.7 2.3 10.2 2.2"/>
  <path d="M.9 5.6C.9 7.6 .8 9.4 1.6 10.7C2.2 11.6 3.3 11.3 3.2 10.4C3.1 9.7 2.3 9.7 2.2 10.2"/>
  <path d="M10.7 1.6C9.6 2.6 8.4 3 7.1 2.8"/><path d="M1.6 10.7C2.6 9.6 3 8.4 2.8 7.1"/>
  <path d="M11.9 1.1C12.9 .45 14.3 .5 15.5 .95C14.3 1.45 12.9 1.6 11.9 1.1Z"/><path d="M12.4 1.08L15 .97"/>
  <path d="M1.1 11.9C.45 12.9 .5 14.3 .95 15.5C1.45 14.3 1.6 12.9 1.1 11.9Z"/><path d="M1.08 12.4L.97 15"/>
  <path d="M15.5 .95C16.8 .9 17.6 1.5 17.4 2.2C17.2 2.8 16.4 2.7 16.5 2.1"/><path d="M.95 15.5C.9 16.8 1.5 17.6 2.2 17.4C2.8 17.2 2.7 16.4 2.1 16.5"/>
  <circle class="bead" cx="19" cy="1" r=".26"/><circle class="bead" cx="20.2" cy="1" r=".19"/><circle class="bead" cx="21.2" cy="1" r=".13"/>
  <circle class="bead" cx="1" cy="19" r=".26"/><circle class="bead" cx="1" cy="20.2" r=".19"/><circle class="bead" cx="1" cy="21.2" r=".13"/>
  ${fan(2.3, 2.3, 45, 1.75, 62, 5)}
  <g transform="translate(.3 .3) rotate(45)">${[0, 90, 180, 270].map(r => `<g transform="rotate(${r})">${LEAF}</g>`).join("")}</g>
  <circle class="bead" cx=".3" cy=".3" r=".22"/>`;

/* A lighter cut of the menu's frame: the same rules, corners and pearls, no crests or garlands. */
function draw() {
const box = document.getElementById("frame"), W = box.clientWidth, H = box.clientHeight, u = Math.min(H / 100, W * .5625 / 100);
const a = 1.7 * u, b = 2.8 * u, R = 3.6 * u, m = (a + b) / 2, sw = Math.max(1, u * .11), C = 1.1;
const arc = (x, y) => `A${R} ${R} 0 0 0 ${x} ${y}`;
const inner = `M${b + R} ${b}H${W - b - R}${arc(W - b, b + R)}V${H - b - R}${arc(W - b - R, H - b)}H${b + R}${arc(b, H - b - R)}V${b + R}${arc(b + R, b)}`;
const at = (x, y, sx, sy, art) => `<g transform="translate(${x} ${y}) scale(${u * sx} ${u * sy})">${art}</g>`;
const pearls = [];
for (let x = m + 8 * u; x < W - m - 8 * u; x += 1.5 * u) pearls.push([x, m], [x, H - m]);
for (let y = m + 8 * u; y < H - m - 8 * u; y += 1.5 * u) pearls.push([m, y], [W - m, y]);
box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" stroke-width="${sw}">
  <rect class="outer" x="${a}" y="${a}" width="${W - 2 * a}" height="${H - 2 * a}"/><path class="inner" d="${inner}"/>
  <g class="pearl">${pearls.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${.13 * u}"/>`).join("")}</g>
  <g class="orn">${at(b, b, C, C, CORNER)}${at(W - b, b, -C, C, CORNER)}${at(b, H - b, C, -C, CORNER)}${at(W - b, H - b, -C, -C, CORNER)}</g></svg>`;
box.querySelectorAll(".orn *").forEach(el => el.setAttribute("vector-effect", "non-scaling-stroke"));
}

/* Events: drop the ones already past, feature each upcoming one in turn. */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const day = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const DOW = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
const MON = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
function kicker(d) {
  const n = Math.round((d - today()) / 864e5);
  if (n === 0) return "TONIGHT";
  if (n === 1) return "TOMORROW";
  if (n < 7) return "THIS " + DOW[d.getDay()];
  return DOW[d.getDay()];
}
const events = ALL.filter(e => day(e.date) >= today()).sort((x, y) => day(x.date) - day(y.date));
let i = 0;

function show() {
  const e = events[i], d = day(e.date);
  $("kick").textContent = kicker(d);
  $("when").textContent = `${MON[d.getMonth()]} ${d.getDate()} · ${e.time.toUpperCase()}`;
  $("title").textContent = e.title.toUpperCase();
  $("desc").textContent = e.desc || "";
  const ph = $("photo");
  if (e.photo) { ph.className = "img"; ph.style.backgroundImage = `url("${encodeURI(e.photo)}")`; ph.textContent = ""; }
  else { ph.className = ""; ph.style.backgroundImage = ""; ph.textContent = "EVENT PHOTO"; }
  $("rsvp").hidden = !e.rsvp;
  if (e.rsvp) {
    $("link").textContent = e.rsvp.replace(/^https?:\/\//, "");
    try { const q = qrcode(0, "M"); q.addData(e.rsvp); q.make(); $("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
    catch { $("qr").textContent = ""; }
  }
  // The list starts at the featured event when it would otherwise fall off the end.
  const from = Math.max(0, Math.min(i - 1, events.length - LIST));
  $("list").innerHTML = events.slice(from, from + LIST).map(x => {
    const xd = day(x.date);
    return `<div class="ev${x === e ? " on" : ""}"><div class="date"><i>${DOW[xd.getDay()].slice(0, 3)}</i><em>${xd.getDate()}</em></div>` +
      `<div><div class="n">${esc(x.title)}</div><div class="m">${esc(x.time)} · ${esc(x.place)}</div></div></div>`;
  }).join("");
  const last = day(events[events.length - 1].date);
  $("through").textContent = `through ${MON[last.getMonth()].slice(0, 1) + MON[last.getMonth()].slice(1, 3).toLowerCase()} ${last.getDate()}`;
  $("dots").innerHTML = events.map((_, k) => `<i${k === i ? ' class="on"' : ""}></i>`).join("");
  $("count").textContent = `${i + 1} of ${events.length}`;
}

function next() {
  const slide = $("slide");
  slide.classList.add("fade");
  setTimeout(() => { i = (i + 1) % events.length; show(); slide.classList.remove("fade"); }, 900);
}

draw();
addEventListener("load", draw);
addEventListener("resize", draw);
if (events.length) { show(); if (events.length > 1) setInterval(next, SECONDS * 1000); }
else $("slide").innerHTML = "";
// Reload every half hour so new events and the date-relative labels stay current.
setTimeout(() => location.reload(), 30 * 60 * 1000);
</script>
</html>
